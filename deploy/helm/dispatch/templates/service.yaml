apiVersion: v1
kind: Service
metadata:
  name: dispatch-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: dispatch
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: dispatch
    app.kubernetes.io/component: api
